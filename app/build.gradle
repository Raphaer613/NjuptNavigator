plugins {
    id "com.android.application"
}

android {
    namespace "com.example.njuptcampusnavigator"
    compileSdk 35

    defaultConfig {
        applicationId "com.example.njuptcampusnavigator"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
        manifestPlaceholders = [
                baiduAk: project.findProperty("BAIDU_AK") ?: ""
        ]
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }

    signingConfigs {
        debug {
            storeFile file("../debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.baidu.lbsyun:BaiduMapSDK_Map:8.2.0"
    implementation "com.baidu.lbsyun:BaiduMapSDK_Search:8.2.0"
    implementation "com.baidu.lbsyun:BaiduMapSDK_Location:9.6.9"
}
